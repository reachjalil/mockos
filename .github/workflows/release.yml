name: Release packages (publishing gate)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  NODE_VERSION: 24.11.1
  PNPM_VERSION: 10.30.2

jobs:
  release:
    name: Version or publish packages
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Create version pull request or publish
        id: changesets
        uses: changesets/action@d94a5c301145045a0960133674e003b265942a22 # v1.8.0
        with:
          version: pnpm exec changeset version
          publish: pnpm --recursive publish --access public --no-git-checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify the published CLI executable
        if: steps.changesets.outputs.published == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cli_version="$(node -p "require('./packages/cli/package.json').version")"
          npm view "@mockos/cli@$cli_version" name version bin engines --json \
            >"$RUNNER_TEMP/mockos-cli-metadata.json"
          node scripts/verify-published-cli.mjs \
            "$RUNNER_TEMP/mockos-cli-metadata.json" "$cli_version"
      - name: Record publishing prerequisite
        run: >-
          printf '%s\n'
          'Publishing requires the explicit NPM_PUBLISH_ENABLED opt-in and an
          authorized NPM_TOKEN. Workflow presence is not publication evidence; only
          the changesets publish result and registry metadata verification are.'
